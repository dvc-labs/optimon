name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Bundle the Worker without deploying or using credentials
        run: npx --yes wrangler@4.152.0 deploy --dry-run --config deploy/wrangler.jsonc --outdir /tmp/optimon-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Validate Compose without production credentials
        run: docker compose -f compose.yaml config --quiet
        env:
          DISCORD_TOKEN: ci-placeholder-not-a-real-token
          APPLICATION_ID: '111111111111111111'
          GUILD_ID: '222222222222222222'
          CHANNEL_ID: '333333333333333333'
          DASHBOARD_PUBLIC_URL: 'https://dashboard.test'
      - name: Build the runtime image
        run: docker build --tag optimon-ci .
      - name: Smoke-test the runtime image without credentials
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true optimon-ci \
            node --input-type=module -e '
              import { commandDefinitions } from "./dist/commands.js";
              import { VERSION } from "./dist/version.js";
              console.log(`Optimon v${VERSION}: ${commandDefinitions().length} commands on ${process.version}`);
            '
      - name: Verify history across replacement containers
        run: |
          history_volume="optimon-history-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$history_volume"
          trap 'docker volume rm "$history_volume" > /dev/null' EXIT
          for phase in save restore; do
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --memory 256m --cpus 0.50 --pids-limit 64 \
              --mount "type=volume,source=$history_volume,target=/app/data" \
              --env "HISTORY_SMOKE_PHASE=$phase" -i optimon-ci \
              node --input-type=module < test/storage-container.mjs
          done
      - name: Build the isolated public dashboard image
        run: docker build --target dashboard --tag optimon-dashboard-ci .
      - name: Verify HTTPS and public isolation in a restricted dashboard container
        run: |
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          chmod 0755 "$fixture_dir"
          mkdir "$fixture_dir/tls" "$fixture_dir/public"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$fixture_dir/tls/origin.key" -out "$fixture_dir/tls/origin.pem" \
            -subj /CN=dashboard.test -addext subjectAltName=DNS:dashboard.test
          cp "$fixture_dir/tls/origin.pem" "$fixture_dir/tls/origin-ca.pem"
          chmod 0644 "$fixture_dir/tls/"*
          FIXTURE_DIR="$fixture_dir" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const live = { capturedAt: Date.now(), hostUptime: 1000, botUptime: 60,
              cpuPercent: 5, cores: 6, memory: null, swap: null, load: [0.1,0.2,0.3], temperatures: [] };
            writeFileSync(`${process.env.FIXTURE_DIR}/public/metrics.json`, JSON.stringify({
              schema: 1, version: "0.3.1", generatedAt: Date.now(), thermalWarnC: 80,
              thermalRecoverC: 75, live, history: null
            }));
          '
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 128m --cpus 0.25 --pids-limit 32 \
            --mount "type=bind,source=$fixture_dir/public,target=/app/public-data,readonly" \
            --mount "type=bind,source=$fixture_dir/tls,target=/app/tls,readonly" \
            --env DASHBOARD_PUBLIC_URL=https://dashboard.test \
            --env DASHBOARD_TLS_CERT=/app/tls/origin.pem \
            --env DASHBOARD_TLS_KEY=/app/tls/origin.key \
            --env DASHBOARD_TLS_CA=/app/tls/origin-ca.pem \
            --env PUBLIC_DATA_PATH=/app/public-data \
            --env NODE_OPTIONS=--max-old-space-size=64 \
            -i optimon-dashboard-ci node --input-type=module < test/dashboard-container.mjs
      - name: Validate both VPS Compose modes and loopback-only Apache publication
        run: |
          docker compose -f compose.fallback.yaml config --format json > /tmp/optimon-fallback-proxy.json
          docker compose -f compose.fallback.apache.yaml config --format json > /tmp/optimon-fallback-apache.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          proxy = json.loads(Path('/tmp/optimon-fallback-proxy.json').read_text())['services']['fallback']
          apache = json.loads(Path('/tmp/optimon-fallback-apache.json').read_text())['services']['fallback']
          ports = apache.pop('ports')
          assert len(ports) == 1
          port = ports[0]
          assert port['host_ip'] == '127.0.0.1'
          assert str(port['published']) == '18080'
          assert port['target'] == 8080 and port['protocol'] == 'tcp'
          assert apache == proxy, 'Both modes must keep the same image, isolation and resource limits'
          print('Both VPS modes match; Apache publication is restricted to 127.0.0.1:18080.')
          PY
        env:
          DASHBOARD_PUBLIC_URL: 'https://dashboard.test'
      - name: Build the isolated VPS fallback image
        run: docker build --target fallback --tag optimon-fallback-ci .
      - name: Verify the fallback without metrics, secrets or a writable filesystem
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 64m --cpus 0.25 --pids-limit 32 \
            --env NODE_OPTIONS=--max-old-space-size=32 \
            -i optimon-fallback-ci node --input-type=module < test/fallback-container.mjs
