name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Validate Compose without production credentials
        run: docker compose -f compose.yaml config --quiet
        env:
          DISCORD_TOKEN: ci-placeholder-not-a-real-token
          APPLICATION_ID: '111111111111111111'
          GUILD_ID: '222222222222222222'
          CHANNEL_ID: '333333333333333333'
      - name: Build the runtime image
        run: docker build --tag optiplex-ci .
      - name: Smoke-test the runtime image without credentials
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true optiplex-ci \
            node --input-type=module -e '
              import { commandDefinitions } from "./dist/commands.js";
              import { VERSION } from "./dist/version.js";
              console.log(`Optiplex v${VERSION}: ${commandDefinitions().length} commands on ${process.version}`);
            '
      - name: Verify history across replacement containers
        run: |
          history_volume="optiplex-history-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$history_volume"
          trap 'docker volume rm "$history_volume" > /dev/null' EXIT
          for phase in save restore; do
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --mount "type=volume,source=$history_volume,target=/app/data" \
              --env "HISTORY_SMOKE_PHASE=$phase" -i optiplex-ci \
              node --input-type=module < test/storage-container.mjs
          done
