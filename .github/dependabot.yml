version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Change the Node runtime and its declarations together during an LTS migration.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Keep receiving Node 24 minor/patch updates; review runtime majors manually.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
